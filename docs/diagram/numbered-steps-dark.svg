<svg xmlns="http://www.w3.org/2000/svg" width="920" height="376" viewBox="0 0 920 376" role="img" aria-label="工作原理编号步骤图">
  <rect x="0.5" y="0.5" width="919" height="375" rx="8" fill="#0d1117" stroke="#3d444d"/>
  <style>
    .col { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .rule { stroke: #3d444d; stroke-width: 1; }
    .num { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; text-anchor: middle; }
    .step { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .circle { fill: #151b23; stroke: #3d444d; }
    .circle.key { fill: #121d2f; stroke: #4493f8; }
    .num.key { fill: #4493f8; }
  </style>

  <text class="col" x="40" y="46">入库</text>
  <line class="rule" x1="40" y1="58" x2="430" y2="58"/>
  <text class="col" x="490" y="46">问答</text>
  <line class="rule" x1="490" y1="58" x2="880" y2="58"/>
  <line class="rule" x1="460" y1="28" x2="460" y2="348"/>

  <circle class="circle" cx="56" cy="92" r="15"/><text class="num" x="56" y="97">1</text>
  <text class="step" x="84" y="90">上传文件</text>
  <text class="desc" x="84" y="110">提交即返回任务号，前端轮询进度</text>
  <circle class="circle" cx="56" cy="150" r="15"/><text class="num" x="56" y="155">2</text>
  <text class="step" x="84" y="148">提交预检</text>
  <text class="desc" x="84" y="168">文件名 / 类型 / 大小 / 数量不合法不落盘</text>
  <circle class="circle" cx="56" cy="208" r="15"/><text class="num" x="56" y="213">3</text>
  <text class="step" x="84" y="206">抽取文本</text>
  <text class="desc" x="84" y="226">Markdown、TXT、PDF、DOCX、HTML 统一纯文本</text>
  <circle class="circle" cx="56" cy="266" r="15"/><text class="num" x="56" y="271">4</text>
  <text class="step" x="84" y="264">切块与指纹</text>
  <text class="desc" x="84" y="284">统一边界切块，SHA-256 拦截重复</text>
  <circle class="circle" cx="56" cy="324" r="15"/><text class="num" x="56" y="329">5</text>
  <text class="step" x="84" y="322">写入数据面</text>
  <text class="desc" x="84" y="342">向量化进 Chroma，元数据进 SQLite 与 uploads</text>

  <circle class="circle" cx="506" cy="92" r="15"/><text class="num" x="506" y="97">1</text>
  <text class="step" x="534" y="90">拆解问题</text>
  <text class="desc" x="534" y="110">按需拆为最多 5 个子问题，分别检索判定</text>
  <circle class="circle" cx="506" cy="150" r="15"/><text class="num" x="506" y="155">2</text>
  <text class="step" x="534" y="148">召回与重排</text>
  <text class="desc" x="534" y="168">向量召回候选，qwen3-rerank 后保留 Top-K</text>
  <circle class="circle key" cx="506" cy="208" r="15"/><text class="num key" x="506" y="213">3</text>
  <text class="step" x="534" y="206">证据判定</text>
  <text class="desc" x="534" y="226">区分“回答证据”与“相关但不足以回答”</text>
  <circle class="circle" cx="506" cy="266" r="15"/><text class="num" x="506" y="271">4</text>
  <text class="step" x="534" y="264">生成答案</text>
  <text class="desc" x="534" y="284">只使用判定为证据的内容，其余局部拒答</text>
  <circle class="circle" cx="506" cy="324" r="15"/><text class="num" x="506" y="329">5</text>
  <text class="step" x="534" y="322">校验输出</text>
  <text class="desc" x="534" y="342">核对引用与数字，失败重生成一次</text>
</svg>
